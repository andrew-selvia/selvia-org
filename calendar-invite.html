<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml"
      xmlns:o="urn:schemas-microsoft-com:office:office">
  <head>
    <title>{{page_title}}</title>
    <!--[if !mso]><!-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!--<![endif]-->
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style type="text/css">
      #outlook a {
        padding: 0;
      }
      body {
        margin: 0;
        padding: 0;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        border-collapse: collapse;
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
      }
      p {
        display: block;
        margin: 13px 0;
      }
      .color-info {
        background: #34C759;
        background-color: #34C759;
      }
      .color-warning {
        background: #FF8D28;
        background-color: #FF8D28;
      }
      .color-danger {
        background: #FF383C;
        background-color: #FF383C;
      }
      :root {
        color-scheme: light dark;
        supported-color-schemes: light dark;
      }
      @media (prefers-color-scheme: dark) {
        .color-info {
          background: #30D158 !important;
          background-color: #30D158 !important;
        }
        .color-warning {
          background: #FF9230 !important;
          background-color: #FF9230 !important;
        }
        .color-danger {
          background: #FF4245 !important;
          background-color: #FF4245 !important;
        }
        .text-primary {
          color: #e8e8e8 !important;
        }
        .event-detail-label,
        .text-muted {
          color: #9a9a9e !important;
        }
        .strikethrough {
          color: #6e6e73 !important;
        }
        .divider {
          border-top-color: #3a3a3c !important;
        }
        a:not([class]) {
          color: #6cb0ff !important;
        }
        .map-light {
          display: none !important;
        }
        .map-dark {
          display: block !important;
        }
      }
      /* RSVP buttons: drop the 3rd action (Maybe); No + Yes side by side (row is
         RTL so Yes ends up on the right), together matching the photo/map width */
      .mj-column-per-33-3:nth-of-type(3) {
        display: none !important;
      }
      .mj-column-per-33-3:nth-of-type(1),
      .mj-column-per-33-3:nth-of-type(2) {
        display: inline-block !important;
        width: 50% !important;
        max-width: 50% !important;
      }
    </style>
    <!--[if mso]>
    <noscript>
      <xml>
        <o:OfficeDocumentSettings>
          <o:AllowPNG/>
          <o:PixelsPerInch>96</o:PixelsPerInch>

    <![endif]-->

        table.mj-full-width-mobile {
          width: 100% !important;
        }
        td.mj-full-width-mobile {
          width: auto !important;
        }
      }
    </style>

  <body class="email-bg" style="word-spacing:normal;background-color:transparent;">
    <div class="email-bg" style="background-color:transparent;">
      <!-- Hidden reference to Stalwart's inline logo attachment so mail clients
           treat it as "used" and don't render it as a loose attachment. -->
      <img src="{{logo_cid}}" alt="" width="1" height="1"
           style="display:none !important;width:1px;height:1px;max-width:0;max-height:0;overflow:hidden;opacity:0;visibility:hidden;mso-hide:all;border:0;">
      <!--[if mso | IE]>
      <table align="center" border="0" cellpadding="0" cellspacing="0" class="" style="width:600px;" width="600"
             bgcolor="white">
        <tr>

      <div class="card" style="background:transparent;background-color:transparent;margin:0px auto;max-width:600px;">

               class="card" style="background:transparent;background-color:transparent;width:100%;">

                         style="vertical-align:top;" width="100%">
                    <tbody>
                      <tr>
                        <td align="center"
                            style="font-size:0px;padding:25px 25px 15px 25px;word-break:break-word;">
                          <div class="text-primary"
                               style="font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;font-size:32px;font-weight:700;line-height:1.2;text-align:center;color:#333333;">
                            Andrew &amp; Ann
                          </div>
                          <div class="text-primary"
                               style="font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;font-size:16px;font-weight:400;line-height:1.4;text-align:center;color:#333333;margin-top:10px;text-transform:uppercase;letter-spacing:1.5px;">
                            invite you to their wedding
                          </div>
                        </td>
                      </tr>
                      <tr>
                        <td align="center"
                            style="font-size:0px;padding:10px 25px;word-break:break-word;">
                          <img alt="" src="https://andrew-selvia.github.io/selvia-org/proposal.jpg"
                               style="border:0;display:block;outline:none;text-decoration:none;height:auto;width:100%;max-width:550px;border-radius:18px;font-size:13px;"
                               width="550">
                        </td>
                      </tr>
                      <tr>
                        <td align="left" class="event-detail"
                            style="margin-bottom: 16px; font-size: 0px; padding: 10px 25px; word-break: break-word;">
                          <div class="text-primary"
                               style="font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;font-size:14px;line-height:1.4;text-align:left;color:#333333;">
                            <a href="https://maps.apple.com/?q=Providence%20Reformed%20Church%20of%20Winnipeg"
                               style="text-decoration:none;">
                              <img alt="Map of the ceremony and reception venues" class="map-light"
                                   src="https://snapshot.apple-mapkit.com/api/v1/snapshot?center=49.9209235%2C-97.141675&amp;spn=0.16%2C0.26&amp;size=600x300&amp;scale=3&amp;t=mutedStandard&amp;colorScheme=light&amp;poi=1&amp;annotations=%5B%7B%22markerStyle%22%3A%22img%22%2C%22point%22%3A%2249.972129%2C-97.059193%22%2C%22imgIdx%22%3A0%7D%2C%7B%22markerStyle%22%3A%22img%22%2C%22point%22%3A%2249.869718%2C-97.224157%22%2C%22imgIdx%22%3A1%7D%5D&amp;imgs=%5B%7B%22url%22%3A%22https%3A%2F%2Fandrew-selvia.github.io%2Fselvia-org%2Fmap-marker.png%22%2C%22width%22%3A36%2C%22height%22%3A36%7D%2C%7B%22url%22%3A%22https%3A%2F%2Fandrew-selvia.github.io%2Fselvia-org%2Freception-marker.png%22%2C%22width%22%3A36%2C%22height%22%3A36%7D%5D&amp;teamId=YX6BJY52AX&amp;keyId=AD4QRMURK6&amp;signature=4uBap98RuzzJOoq1EXYRHV--yOIzHPN9Ju5RsfwAvME_8uvfFnIXwUEwdSiwDyxngDjSE6wkikRtJDzIno_a-A"

                              <img alt="Map of the ceremony and reception venues" class="map-dark"
                                   src="https://snapshot.apple-mapkit.com/api/v1/snapshot?center=49.9209235%2C-97.141675&amp;spn=0.16%2C0.26&amp;size=600x300&amp;scale=3&amp;t=mutedStandard&amp;colorScheme=dark&amp;poi=1&amp;annotations=%5B%7B%22markerStyle%22%3A%22img%22%2C%22point%22%3A%2249.972129%2C-97.059193%22%2C%22imgIdx%22%3A0%7D%2C%7B%22markerStyle%22%3A%22img%22%2C%22point%22%3A%2249.869718%2C-97.224157%22%2C%22imgIdx%22%3A1%7D%5D&amp;imgs=%5B%7B%22url%22%3A%22https%3A%2F%2Fandrew-selvia.github.io%2Fselvia-org%2Fmap-marker.png%22%2C%22width%22%3A36%2C%22height%22%3A36%7D%2C%7B%22url%22%3A%22https%3A%2F%2Fandrew-selvia.github.io%2Fselvia-org%2Freception-marker.png%22%2C%22width%22%3A36%2C%22height%22%3A36%7D%5D&amp;teamId=YX6BJY52AX&amp;keyId=AD4QRMURK6&amp;signature=QV6Pfhwu05hgOQj_T8bd1ffbvW1cuO0YD9R3cNbK6KDhE2MH_801CBj8O3oSrulpssKEB4QCYuV7hEvc2tC8rQ"
                                   width="550"
                                   style="border:0;display:none;outline:none;text-decoration:none;height:auto;width:100%;max-width:550px;border-radius:18px;font-size:13px;">
                            </a>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <!--[if mso | IE]></td></tr></table><![endif]-->
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!--[if mso | IE]></td></tr></table><![endif]-->
      {{#if rsvp}}
      <!--[if mso | IE]>
      <table align="center" border="0" cellpadding="0" cellspacing="0" class="" style="width:600px;" width="600"
             bgcolor="white">
        <tr>
          <td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
      <div class="card" style="background:transparent;background-color:transparent;margin:0px auto;max-width:600px;">
        <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation"
               class="card" style="background:transparent;background-color:transparent;width:100%;">
          <tbody>
            <tr>
              <td style="direction:ltr;font-size:0px;padding:0 20px 5px 20px;text-align:center;">
                <!--[if mso | IE]>
                <table role="presentation" border="0" cellpadding="0" cellspacing="0">
                  <tr>
                    <td class="" style="width:590px;"><![endif]-->
                <div class="mj-column-per-100 mj-outlook-group-fix"
                     style="font-size:0;line-height:0;text-align:left;display:inline-block;width:100%;direction:rtl;">
                  <!--[if mso | IE]>
                  <table border="0" cellpadding="0" cellspacing="0" role="presentation">
                    <tr><![endif]-->

                  {{#each actions}}
                  <!--[if mso | IE]>
                  <td style="vertical-align:top;width:196px;"><![endif]-->
                  <div class="mj-column-per-33-3 mj-outlook-group-fix"
                       style="font-size:0px;text-align:left;direction:ltr;display:inline-block;vertical-align:top;width:33.3%;">
                    <table border="0" cellpadding="0" cellspacing="0" role="presentation"
                           style="vertical-align:top;" width="100%">
                      <tbody>
                        <tr>
                          <td align="left" vertical-align="middle"
                              style="font-size:0px;padding:10px 10px;word-break:break-word;">

                                   role="presentation"
                                   style="border-collapse:separate;width:100%;line-height:100%;">

                                    class="color-{{color}}"
                                    style="border:none;border-radius:30px;cursor:auto;mso-padding-alt:8px 4px;"
                                    valign="middle">
